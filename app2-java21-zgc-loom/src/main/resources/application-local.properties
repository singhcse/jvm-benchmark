## ── Local development profile (App2 — Java 21 ZGC + Loom) ────────────────────

spring.datasource.url=jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Virtual threads confirmed at startup — check console for:
## [App2] Virtual thread confirmed: true
logging.level.com.benchmark=DEBUG
logging.level.org.springframework.web=INFO
