## App 2 — Java 21 + ZGC + Virtual Threads (Project Loom)
spring.application.name=app2-java21-zgc-loom
server.port=8081

## Virtual Threads — enables Loom across the whole application
## (VirtualThreadConfig.java also wires Tomcat's executor directly)
spring.threads.virtual.enabled=true

## Datasource
spring.datasource.url=${POSTGRES_URL:jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${POSTGRES_DRIVER:org.h2.Driver}
spring.datasource.username=${POSTGRES_USER:sa}
spring.datasource.password=${POSTGRES_PASSWORD:}

## JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

## H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## App info
info.app.name=App2 - Modern JVM + Loom
info.app.java-version=21
info.app.gc=ZGC (Generational)
info.app.compiler=JIT HotSpot (C1+C2 Tiered)
info.app.threads=Virtual Threads (Project Loom)
info.app.port=8081

logging.level.com.benchmark=INFO
logging.level.org.springframework.web=WARN
