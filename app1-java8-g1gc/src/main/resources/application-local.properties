## ── Local development profile (IntelliJ / no Docker) ─────────────────────────
## Activated by: -Dspring.profiles.active=local  OR  SPRING_PROFILES_ACTIVE=local
## Uses H2 in-memory — no PostgreSQL installation required.

spring.datasource.url=jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

## H2 web console — open http://localhost:8080/h2-console
## JDBC URL: jdbc:h2:mem:benchmarkdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Verbose logging for local dev
logging.level.com.benchmark=DEBUG
logging.level.org.springframework.web=INFO
