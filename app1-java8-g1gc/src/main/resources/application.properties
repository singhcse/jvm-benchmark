## App 1 — Java 8 + G1GC + JIT HotSpot
spring.application.name=app1-java8-g1gc
server.port=8080

## Datasource — falls back to H2 if POSTGRES_URL not set
spring.datasource.url=${POSTGRES_URL:jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${POSTGRES_DRIVER:org.h2.Driver}
spring.datasource.username=${POSTGRES_USER:sa}
spring.datasource.password=${POSTGRES_PASSWORD:}

## JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

## H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## Custom app info for Actuator /info
info.app.name=App1 - Traditional JVM
info.app.java-version=8
info.app.gc=G1GC
info.app.compiler=JIT HotSpot (C1+C2 Tiered)
info.app.threads=Platform (OS) threads
info.app.port=8080

## Logging
logging.level.com.benchmark=INFO
logging.level.org.springframework.web=WARN
