## App 1 — Docker profile (PostgreSQL + no H2)
spring.datasource.url=jdbc:postgresql://postgres:5432/benchmarkdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=benchmark
spring.datasource.password=benchmark123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

## Schema handled by db/init.sql via Docker volume mount
spring.sql.init.mode=never

## H2 console disabled in Docker
spring.h2.console.enabled=false

logging.level.com.benchmark=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
