## ── Local development profile (App3 — GraalVM, JVM mode) ─────────────────────
## In IntelliJ, App3 runs as a normal JVM app (not a native binary).
## Native compilation only happens via: mvnw.cmd -Pnative native:compile
## The app will log: "Running as native image: false" — this is expected locally.

spring.datasource.url=jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

## H2 console is disabled in main properties for native; re-enable for local JVM mode
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Disable AOT in local JVM mode — Spring will use normal bean creation
spring.aot.enabled=false

logging.level.com.benchmark=DEBUG
logging.level.org.springframework.web=INFO
