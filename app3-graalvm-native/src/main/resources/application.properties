## App 3 — GraalVM Native Image (AOT compiled)
spring.application.name=app3-graalvm-native
server.port=8082

## Datasource
spring.datasource.url=${POSTGRES_URL:jdbc:h2:mem:benchmarkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${POSTGRES_DRIVER:org.h2.Driver}
spring.datasource.username=${POSTGRES_USER:sa}
spring.datasource.password=${POSTGRES_PASSWORD:}

## JPA
## Note: 'create-drop' is safer for native image — DDL auto-generation
## is resolved at build time via AOT, not at runtime
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

## H2 Console (available in JVM mode; not in native image)
spring.h2.console.enabled=false

## Actuator — native image exposes the same endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

## App info
info.app.name=App3 - GraalVM Native Image
info.app.java-version=21 (GraalVM)
info.app.gc=Serial GC (native default)
info.app.compiler=AOT (native-image, no JIT)
info.app.threads=Platform threads
info.app.port=8082
info.app.native=true

## Native image specific
## Disable lazy initialisation — AOT resolves at build time
spring.main.lazy-initialization=false

logging.level.com.benchmark=INFO
logging.level.org.springframework.web=WARN

## Reduce startup noise in native image
logging.level.org.hibernate=WARN
logging.level.com.zaxxer=WARN
